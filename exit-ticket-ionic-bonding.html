<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ionic bonding Exit Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b36;--muted:#56666f;--paper:#f3f6f5;--line:#d3dedb;--accent:#5b3f8f;--accent-soft:#efe9f8;--ok:#2e7d4f;--ok-bg:#e7f4ec;--bad:#b8403a;--bad-bg:#f9e8e6;--flag:#a86a00;--flag-bg:#fff3dc}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{border:0;border-radius:10px;padding:11px 22px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;font-size:17px}
.btn.secondary{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-weight:700;margin-top:10px}

/* sign-in ticket */
.signin{max-width:640px;margin:28px auto;padding:0 16px}
.ticket{background:#fff;border-radius:14px;box-shadow:0 1px 0 var(--line),0 10px 30px rgba(29,43,54,.07);overflow:hidden}
.stub{background:var(--accent);color:#fff;padding:22px 26px 24px}
.stub .unit{font-size:15px;opacity:.9}
.stub h1{font-size:clamp(30px,6vw,42px);font-weight:800;letter-spacing:-.015em;margin-top:2px}
.stub .time{margin-top:6px;font-size:15px;opacity:.92}
.perf{position:relative;height:0;border-top:3px dashed var(--line)}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--paper)}
.perf::before{left:-12px}.perf::after{right:-12px}
.tbody{padding:22px 26px 28px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700}
.fields input,.fields select{border:2px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;font-weight:400;min-width:0}
.fields input.error,.fields select.error{border-color:var(--bad);background:var(--bad-bg)}
.fields .full{grid-column:1/-1}
.phen{margin:0 0 18px;padding:12px 14px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0}
.phen b{display:block;font-size:15px;color:var(--accent)}

/* test layout */
.bar{background:var(--accent);color:#fff}
.bar .inner{max-width:1280px;margin:0 auto;padding:10px 18px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.bar h1{font-size:22px;font-weight:800}
.bar .who{font-size:15px;opacity:.92;margin-right:auto}
.navq{display:flex;flex-wrap:wrap;gap:6px}
.navq button{min-width:38px;height:36px;border-radius:8px;border:2px solid rgba(255,255,255,.55);background:transparent;color:#fff;font-weight:700;cursor:pointer;position:relative;padding:0 8px}
.navq button.done{background:rgba(255,255,255,.22)}
.navq button.cur{background:#fff;color:var(--accent);border-color:#fff}
.navq button.flagged::after{content:"⚑";position:absolute;top:-9px;right:-6px;font-size:13px;background:var(--flag-bg);color:var(--flag);border-radius:50%;width:18px;height:18px;line-height:18px;border:1px solid var(--flag)}
.main{max-width:1280px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px}
.stim{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.stim .phen{margin:14px 16px 0}
.tabs{display:flex;gap:2px;padding:12px 12px 0;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;padding:8px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.tabpanel{padding:14px 18px 18px;overflow:auto}
.tabpanel p{margin:0 0 10px;max-width:62ch}
.tabpanel h3{font-size:17px;margin:4px 0 8px}
.tabpanel svg{width:100%;height:auto;display:block}
.cap{font-size:14px;color:var(--muted);margin-top:6px}
table.data{border-collapse:collapse;margin:4px 0 16px;font-size:16px}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.data th{background:#f4f8f7}
table.data td:first-child{font-weight:700;text-align:left}
.qpane{padding:18px 20px 20px;min-height:420px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:15px;margin-bottom:8px}
.flag{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:14px;padding:4px 10px;color:var(--muted);cursor:pointer}
.flag[aria-pressed="true"]{background:var(--flag-bg);border-color:var(--flag);color:var(--flag);font-weight:700}
.prompt{font-weight:700;font-size:18px;margin:0 0 8px}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.uses button{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;cursor:pointer}
.hint{color:var(--muted);font-size:15px;margin:-4px 0 10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:0 0 auto}
.opt .nuc{font-size:20px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
select.pick{border:2px solid #9fb4b0;border-radius:8px;padding:6px 10px;background:#fff;cursor:pointer;min-width:120px}
select.pick.has{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.nums{display:flex;flex-wrap:wrap;gap:12px}
.nums label{display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700}
.unitwrap{display:flex;align-items:center;gap:6px;font-weight:400}
input.n{width:110px;border:2px solid #9fb4b0;border-radius:8px;padding:7px 10px}
table.grid{border-collapse:collapse}
table.grid th,table.grid td{border:1px solid var(--line);padding:7px 9px;text-align:center}
table.grid th{background:#f7fbfa;font-size:15px}
table.grid td:first-child{text-align:left;font-weight:700}
table.grid input.n{width:66px;text-align:center}
.cer{display:flex;flex-direction:column;gap:10px}
.cer-part{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cer-part label{display:flex;gap:8px;align-items:baseline;font-weight:700;flex-wrap:wrap}
.tag{background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-size:14px}
.guide{font-weight:400;color:var(--muted);font-size:15px}
.cer-part textarea{width:100%;margin-top:8px;min-height:72px;border:2px solid #9fb4b0;border-radius:10px;padding:9px 11px;resize:vertical}
.pt{display:grid;grid-template-columns:20px repeat(18,minmax(0,1fr));gap:0;max-width:560px;font-size:12px}
.pt .gh,.pt .ph{color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center}
.pt .cell{aspect-ratio:1;border:1px solid #c7d3d0;margin:0 -1px -1px 0;background:#fff;border-radius:0;padding:0;font-weight:700;font-size:clamp(9px,1.6vw,12px);cursor:pointer;color:var(--ink)}
.pt .cell:hover{border-color:var(--accent);background:var(--accent-soft)}
.pt .cell.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.pt .sl{box-shadow:inset 4px 0 0 #1d2b36}.pt .sb{box-shadow:inset 0 -4px 0 #1d2b36}.pt .sl.sb{box-shadow:inset 4px 0 0 #1d2b36,inset 0 -4px 0 #1d2b36}
.pt .cell:focus-visible{position:relative;z-index:1}
.ptkey{font-size:14px;color:var(--muted);margin-top:6px}
.bohr{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:center}
.bohr svg{width:100%;height:auto;display:block}
.shells{display:flex;flex-direction:column;gap:8px}
.shellrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.shellrow .nm{font-weight:700;min-width:64px}
.shellrow button{width:36px;height:36px;border-radius:8px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:20px;font-weight:700;cursor:pointer;line-height:1}
.shellrow button:disabled{opacity:.35;cursor:default}
.shellrow output{min-width:28px;text-align:center;font-size:20px;font-weight:700}
.bohrtotal{font-size:15px;color:var(--muted)}
@media (max-width:520px){.bohr{grid-template-columns:1fr}}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid #edf2f1}
.nuc{display:inline-flex;align-items:center;white-space:nowrap;font-weight:700}
.nn{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.66em;line-height:1.05;margin-right:2px}
.review-list{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.review-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.st{font-size:14px;font-weight:700;border-radius:999px;padding:1px 10px}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.no{background:var(--bad-bg);color:var(--bad)}.st.fl{background:var(--flag-bg);color:var(--flag)}
.review-list li>span:last-child{display:flex;gap:4px;flex-wrap:nowrap;white-space:nowrap}
.confirmbox{margin-top:14px;border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.confirmbox p{margin:0}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;padding:0}

/* ---- drag-and-drop questions ---- */
.dnd{margin-top:4px}
.dbank{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:54px;padding:10px;border:2px dashed #b9c9c6;border-radius:10px;background:#f7fbfa;margin-bottom:12px}
.dbank .dhint{color:var(--muted);font-size:14px}
.dchip{touch-action:none;-webkit-user-select:none;user-select:none;border:2px solid var(--accent);background:#fff;color:var(--ink);font-weight:700;padding:6px 12px;border-radius:8px;cursor:grab;line-height:1.3;text-align:left;font-size:15px}
.dchip:hover{background:var(--accent-soft)}
.dchip.on{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.dchip:disabled{cursor:default;opacity:1}
.dchip.lift{opacity:.35}
.dghost{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 8px 18px rgba(0,0,0,.25);margin:0}
.dzone{min-height:44px;border:2px dashed #9fb4b0;border-radius:8px;background:#fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 6px;cursor:pointer}
.dzone .dph{color:#8a979c;font-size:14px;padding:0 4px}
.dzone.target{border-color:var(--accent);background:#fdf7fa}
.dzone.hover{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.dzone.filled{border-style:solid;border-color:#b7cfcb}
.dzone.right{border-color:var(--ok);background:var(--ok-bg);border-style:solid}
.dzone.wrong{border-color:var(--bad);background:var(--bad-bg);border-style:solid}
.dchip.right{border-color:var(--ok);background:var(--ok-bg)}
.dchip.wrong{border-color:var(--bad);background:var(--bad-bg)}
.dlabel{position:relative}
.dlabel .dfig svg{width:100%;height:auto;display:block}
.dlabel .dzone{position:absolute;transform:translateY(-50%);min-height:38px;padding:2px 4px}
.dlabel .dzone .dph{font-size:12px}
.dlabel .dzone .dchip{font-size:13px;padding:4px 8px}
.dfig2{margin:0 0 12px;max-width:560px}
.dfig2 svg{width:100%;height:auto;display:block}
.drows{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:12px;align-items:center}
.drow>span{font-weight:700}
.dorder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dorder li{display:flex;gap:10px;align-items:center}
.dorder .onum{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.dorder .dzone{flex:1}
.dbins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dbin{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.dbin .bt{background:var(--accent-soft);color:var(--ink);font-weight:700;padding:6px 10px;font-size:15px}
.dbin .dzone{border:0;border-radius:0;min-height:120px;align-content:flex-start;padding:8px}
.dbin .dzone.hover,.dbin .dzone.target{outline:2px dashed var(--accent);outline-offset:-4px}
.dfill{line-height:2.6;margin:0;font-size:17px}
.dfill .dzone{display:inline-flex;vertical-align:middle;min-width:120px;min-height:38px;margin:0 2px;padding:2px 4px}
@media (max-width:520px){.dlabel .dzone .dchip{font-size:11px;padding:2px 5px}.dlabel .dzone .dph{font-size:10px}}
/* results */
.results{max-width:900px;margin:0 auto;padding:18px}
.results .panel{padding:20px 22px}
.score{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:56px;line-height:1}
.score small{font-size:24px;color:var(--muted);font-weight:600}
.res-top{display:flex;flex-wrap:wrap;gap:16px 36px;align-items:end;margin:6px 0 14px}
.res-meta{color:var(--muted);font-size:16px}
.sendbox{border-radius:10px;padding:10px 14px;margin:6px 0 4px;font-weight:700}
.sendbox.ok{background:var(--ok-bg);color:var(--ok)}.sendbox.wait{background:#eef3f2;color:var(--muted)}.sendbox.bad{background:var(--bad-bg);color:var(--bad)}
.res{border:1px solid var(--line);border-left:6px solid #9aa8ab;border-radius:10px;padding:12px 14px;margin-top:12px;break-inside:avoid}
.res.ok{border-left-color:var(--ok)}.res.bad{border-left-color:var(--bad)}.res.part{border-left-color:#c49000}
.res h3{font-size:17px;font-family:"Atkinson Hyperlegible",sans-serif;display:flex;gap:10px;align-items:baseline}
.res h3 .pts{margin-left:auto;font-weight:700;white-space:nowrap}
.res ul{margin:8px 0 0;padding-left:20px}
.good{color:var(--ok)}.wrong{color:var(--bad)}
.explain{margin:10px 0 0;background:#f7fbfa;border-radius:8px;padding:8px 10px;font-size:16px}
.student{white-space:pre-wrap;background:#fff;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.vocab span{border-radius:999px;padding:2px 10px;font-size:14px;border:1px solid}
.vocab .hit{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.vocab .miss{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.cer-res{margin-top:10px}
.cer-res h4{margin:0;font-size:15px;display:flex;gap:8px}
.cer-res h4 .pts{margin-left:auto}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}
@media (max-width:900px){.main{grid-template-columns:1fr}.stim{position:static;max-height:none}}
@media (max-width:520px){.fields{grid-template-columns:1fr}.row{grid-template-columns:1fr}.tbody,.stub{padding-left:18px;padding-right:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff;font-size:11pt}.no-print,#signin,#test{display:none!important}.results{padding:0}.results .panel{border:0;padding:0}.score{font-size:34pt}.res-q-fig svg{max-width:320px}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2b36"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8403a"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3f8f"/></marker>
</defs></svg>

<!-- sign in -->
<section class="signin" id="signin">
 <div class="ticket">
  <div class="stub">
   <div class="unit">Chemistry exit ticket</div>
   <h1>Ionic bonding</h1>
   <div class="time" id="stubtime"></div>
  </div>
  <div class="perf" aria-hidden="true"></div>
  <div class="tbody">
   <div class="phen" id="phen1"></div>
   <div id="signform">
    <div class="fields" id="fields"></div>
    <div class="btn-row" style="margin-top:20px"><button class="btn" type="button" id="startbtn">Start exit ticket</button></div>
    <div class="err" id="signerr" role="alert"></div>
   </div>
  </div>
 </div>
</section>

<!-- test -->
<section id="test" hidden>
 <div class="bar"><div class="inner">
  <h1>Ionic bonding</h1><span class="who" id="whoami"></span>
  <nav class="navq" id="navq" aria-label="Questions"></nav>
 </div></div>
 <div class="main">
  <div class="panel stim" id="stim">
   <div class="phen" id="phen2"></div>
   <div class="tabs" role="tablist" id="tabs" aria-label="Stimulus"></div>
   <div class="tabpanel" id="tabpanel" role="tabpanel"></div>
  </div>
  <div class="panel qpane" id="qpane"></div>
 </div>
</section>

<!-- results -->
<section class="results" id="results" hidden></section>
<div id="live" class="sr-only" aria-live="polite"></div>

<script src="exit-ticket-config.js"></script>
<script>
/* ===== Ionic bonding: Lewis dots, electron transfer, lattice, compound builder ===== */
const IB=(function(){
  const f=n=>(+n).toFixed(1);
  const T=(x,y,t,o)=>{o=o||{};return `<text x="${f(x)}" y="${f(y)}" font-size="${o.size||12}" font-weight="${o.w||700}" text-anchor="${o.a||"middle"}" fill="${o.c||"#1d2b36"}" font-family="system-ui,sans-serif">${t}</text>`;};
  const REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const M={Li:{n:"Lithium",c:1},Na:{n:"Sodium",c:1},K:{n:"Potassium",c:1},Mg:{n:"Magnesium",c:2},Ca:{n:"Calcium",c:2},Al:{n:"Aluminum",c:3}};
  const N={F:{n:"Fluorine",ide:"fluoride",c:-1,v:7},Cl:{n:"Chlorine",ide:"chloride",c:-1,v:7},O:{n:"Oxygen",ide:"oxide",c:-2,v:6},S:{n:"Sulfur",ide:"sulfide",c:-2,v:6},N:{n:"Nitrogen",ide:"nitride",c:-3,v:5}};
  const SUB="₀₁₂₃₄₅₆₇₈₉",sub=n=>n===1?"":String(n).split("").map(d=>SUB[d]).join("");
  const SUP=c=>(Math.abs(c)>1?"⁰¹²³⁴⁵⁶⁷⁸⁹"[Math.abs(c)]:"")+(c>0?"⁺":"⁻");
  const gcd=(a,b)=>b?gcd(b,a%b):a;
  function formula(m,x){const cm=M[m].c,cx=-N[x].c,l=cm*cx/gcd(cm,cx);return{m:l/cm,x:l/cx,text:m+sub(l/cm)+x+sub(l/cx)};}
  const name=(m,x)=>`${M[m].n.toLowerCase()} ${N[x].ide}`;
  /* Lewis symbol with n dots placed top, right, bottom, left, then paired; o.newDots: indices (1-based fill order) colored as gained */
  function lewis(x,y,sym,n,o){o=o||{};let s=T(x,y+8,sym,{size:o.size||26,c:o.col||"#1d2b36"});const d=o.r||22,g=5;

  /* Na + Cl → Na+ Cl− picture */
  function transferSVG(m,x,o){o=o||{};const f0=formula(m,x),cm=M[m].c,vx=N[x].v;let s=`<defs><marker id="ibA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a5ad0"/></marker></defs>`;

    s+=T(270,128,"↓ electrons transfer",{size:13,c:"#7a5ad0"});let x1=50;
    for(let k=0;k<nm;k++){s+=lewis(x1,186,m,0,{bracket:SUP(cm)});x1+=90;}for(let k=0;k<nx;k++){s+=lewis(x1+20,186,x,8,{bracket:SUP(N[x].c),newFrom:vx+1});x1+=110;}
    s+=T(270,250,`${f0.text}: ${name(m,x)}`,{size:15,c:"#2e7d4f"});
    return `<svg viewBox="0 0 560 262" role="img" aria-label="${nm} ${M[m].n.toLowerCase()} atom${nm>1?"s":""} each give ${cm} electron${cm>1?"s":""} to ${nx} ${N[x].n.toLowerCase()} atom${nx>1?"s":""}. They become ${M[m].n.toLowerCase()} ions with a ${SUP(cm)} charge and ${N[x].ide} ions with a ${SUP(N[x].c)} charge, forming ${f0.text}.">${s}</svg>`;}
  function lattice(o){o=o||{};let s="";const n=o.n||6,sz=o.sz||46;for(let i=0;i<n;i++)for(let j=0;j<5;j++){const a=(i+j)%2===0,cx=40+i*sz,cy=36+j*sz;s+=a?`<circle cx="${cx}" cy="${cy}" r="${sz*0.42}" fill="#7fd67f" stroke="#2e7d4f" stroke-width="2"/>`+T(cx,cy+4,"Cl⁻",{size:11}):`<circle cx="${cx}" cy="${cy}" r="${sz*0.26}" fill="#b9a4e0" stroke="#5b3f8f" stroke-width="2"/>`+T(cx,cy+4,"Na⁺",{size:9});}
    return `<svg viewBox="0 0 ${40+n*sz} ${36+5*sz}" role="img" aria-label="A crystal lattice: a repeating grid where every sodium ion is surrounded by chloride ions and every chloride ion is surrounded by sodium ions.">${s}</svg>`;}

  /* ---- animated transfer and bonding ---- */
  function dotXY(x,y,num,r){const g=5,pos=[[0,-1],[1,0],[0,1],[-1,0]];const j=(num-1)%4,second=num>4;const[px,py]=pos[j];const cx=x+px*r,cy=y+py*r;
    const ofs=second?g:(num<=4&&false?0:0);

  function dotPositions(x,y,n,r){const out=[];const pos=[[0,-1],[1,0],[0,1],[-1,0]],g=5;for(let num=1;num<=n;num++){const j=(num-1)%4,paired=(j<n-4)||num>4;const[px,py]=pos[j];const cx=x+px*r,cy=y+py*r;const k=num>4?1:0;const o=paired?(k?g:-g):0;out.push([px?cx:cx+o,px?cy+o:cy]);}return out;}

  function animSVG(m,x,t,L){const cm=M[m].c,cx=-N[x].c,vx=N[x].v,fm=formula(m,x);const nm=fm.m,nx=fm.x,r=22;
    const totalE=nm*cm,eDur=0.9,phase1=totalE*eDur,phase2=0.7,phase3=1.4;
    const mS=[],xS=[];let xp=50;for(let i=0;i<nm;i++){mS.push([xp,80]);xp+=82;}xp+=30;for(let j=0;j<nx;j++){xS.push([xp+10,80]);xp+=104;}
    // final arrangement: alternate ions in one row, centered
    const seq=[];let a=nm,b=nx;const startX=nx>=nm?"x":"m";let turn=startX;while(a+b>0){if(turn==="x"&&b>0){seq.push(["x",nx-b]);b--;}else if(turn==="m"&&a>0){seq.push(["m",nm-a]);a--;}else if(b>0){seq.push(["x",nx-b]);b--;}else{seq.push(["m",nm-a]);a--;}turn=turn==="x"?"m":"x";}
    const sp=112,x0=L/2-(seq.length-1)*sp/2,F={};seq.forEach(([k,i],q)=>{F[k+i]=[x0+q*sp,190];});
    const ease=u=>u<0?0:u>1?1:u*u*(3-2*u);
    let s="";const moved=Math.min(totalE,Math.floor(t/eDur)),frac=Math.min(1,(t%eDur)/eDur*1.15);

    const pos=(arr,i,key)=>{const S=arr[i],Fp=F[key+i];return[S[0]+(Fp[0]-S[0])*u3,S[1]+(Fp[1]-S[1])*u3];};
    // metals
    for(let i=0;i<nm;i++){const[px,py]=pos(mS,i,"m");const left=cm-assign.filter((a,k)=>a.from===i&&k<moved+(t<phase1&&frac>=1?1:0)).length;
      s+=T(px,py+8,m,{size:26,c:ions?"#b8403a":"#1d2b36"});const ds=dotPositions(px,py,Math.max(0,left),r);ds.forEach(([dx,dy])=>{s+=`<circle cx="${f(dx)}" cy="${f(dy)}" r="3.6" fill="#1d2b36"/>`;});
      if(ions){const o=Math.min(1,t2/phase2);s+=`<g opacity="${f(o)}"><path d="M${px-r-8},${py-r-6} h-6 v${2*r+12} h6 M${px+r+8},${py-r-6} h6 v${2*r+12} h-6" fill="none" stroke="#1d2b36" stroke-width="2"/>`+T(px+r+20,py-r-2,SUP(cm),{size:16,c:"#b8403a",a:"start"})+`</g>`;}}
    // nonmetals
    for(let j=0;j<nx;j++){const[px,py]=pos(xS,j,"x");s+=T(px,py+8,x,{size:26,c:ions?"#2f5d9b":"#1d2b36"});
      const got=assign.filter((a,k)=>a.to===j&&k<moved).length;const n=vx+got;
      for(let num=1;num<=n;num++){const pp=dotPositions(px,py,n,r)[num-1];s+=`<circle cx="${f(pp[0])}" cy="${f(pp[1])}" r="3.6" fill="${num>vx?"#7a5ad0":"#1d2b36"}"/>`;}
      if(ions){const o=Math.min(1,t2/phase2);s+=`<g opacity="${f(o)}"><path d="M${px-r-8},${py-r-6} h-6 v${2*r+12} h6 M${px+r+8},${py-r-6} h6 v${2*r+12} h-6" fill="none" stroke="#1d2b36" stroke-width="2"/>`+T(px+r+20,py-r-2,SUP(-cx),{size:16,c:"#2f5d9b",a:"start"})+`</g>`;}}
    // flying electron
    if(t<phase1&&moved<totalE){const a=assign[moved];const[sx,sy]=dotPositions(mS[a.from][0],80,cm-assign.filter((q,k)=>q.from===a.from&&k<moved).length,r).slice(-1)[0]||[mS[a.from][0]+r,80];
      const[ex,ey]=slotXY(xS[a.to][0],80,a.toNum,r);const u=ease(frac);const mx=(sx+ex)/2,my=Math.min(sy,ey)-60;const bx=(1-u)*(1-u)*sx+2*(1-u)*u*mx+u*u*ex,by=(1-u)*(1-u)*sy+2*(1-u)*u*my+u*u*ey;
      s+=`<path d="M${f(sx)},${f(sy)} Q${f(mx)},${f(my)} ${f(ex)},${f(ey)}" fill="none" stroke="#c7b8ea" stroke-width="2" stroke-dasharray="4 4"/><circle cx="${f(bx)}" cy="${f(by)}" r="6" fill="#7a5ad0" stroke="#fff" stroke-width="2"/>`+T(bx,by-12,"e⁻",{size:12,c:"#7a5ad0"});}

    else if(t<phase1)s+=T(L/2,248,`Electron ${Math.min(totalE,moved+1)} of ${totalE} moving from ${M[m].n.toLowerCase()} to ${N[x].n.toLowerCase()}`,{size:13,c:"#7a5ad0"});

  function animate(el,m,x,done){const L=Math.max(560,120+(formula(m,x).m+formula(m,x).x)*112);let t0=null,raf=null;

  /* ---- compound builder ---- */
  function builder(el,opt){opt=opt||{};const st={m:opt.m||"Na",x:opt.x||"Cl",nm:1,nx:1,made:{}};const targets=opt.targets||null;
    function draw(){const cm=M[st.m].c,cx=N[st.x].c,pos=st.nm*cm,neg=st.nx*cx,bal=pos+neg===0;let s="";
      for(let k=0;k<st.nm;k++){const x=50+k*70;s+=`<circle cx="${x}" cy="80" r="24" fill="#f6b8ab" stroke="#b8403a" stroke-width="2"/>`+T(x,78,st.m,{size:13})+T(x,94,SUP(cm),{size:12,c:"#b8403a"});}
      for(let k=0;k<st.nx;k++){const x=50+k*70;s+=`<circle cx="${x}" cy="170" r="30" fill="#b3d1ef" stroke="#2f5d9b" stroke-width="2"/>`+T(x,168,st.x,{size:13})+T(x,184,SUP(cx),{size:12,c:"#2f5d9b"});}
      s+=T(380,60,`Positive: ${st.nm} × (+${cm}) = +${pos}`,{size:14,a:"start",c:"#b8403a"})+T(380,86,`Negative: ${st.nx} × (${cx}) = ${neg}`,{size:14,a:"start",c:"#2f5d9b"})+T(380,116,`Total charge: ${pos+neg>0?"+":""}${pos+neg}`,{size:15,a:"start",c:bal?"#2e7d4f":"#b8403a"});

    const opts=(obj,key,sel)=>Object.keys(obj).map(k=>`<button type="button" class="btn secondary" style="padding:4px 10px;font-size:15px;${k===sel?"background:var(--accent-soft)":""}" data-ib${key}="${k}" aria-pressed="${k===sel}">${k}</button>`).join("");

      <div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:4px"><div style="display:flex;align-items:center;gap:6px"><b>Metal ions</b><button type="button" class="btn secondary" style="padding:3px 12px" data-ibn="m:-1" aria-label="Remove a metal ion">−</button><span class="ibnm" style="font-weight:700;min-width:20px;text-align:center"></span><button type="button" class="btn secondary" style="padding:3px 12px" data-ibn="m:1" aria-label="Add a metal ion">+</button></div>
      <div style="display:flex;align-items:center;gap:6px"><b>Nonmetal ions</b><button type="button" class="btn secondary" style="padding:3px 12px" data-ibn="x:-1" aria-label="Remove a nonmetal ion">−</button><span class="ibnx" style="font-weight:700;min-width:20px;text-align:center"></span><button type="button" class="btn secondary" style="padding:3px 12px" data-ibn="x:1" aria-label="Add a nonmetal ion">+</button></div></div>
      <div class="btn-row" style="margin:8px 0 0"><button type="button" class="btn" data-ibbond="1">Bond them!</button></div><p class="ibmsg" aria-live="polite" style="margin:6px 0 0"></p><div class="iban" style="margin-top:8px"></div>`;
    const pk=el.querySelector(".ibpick"),sc=el.querySelector(".ibscene"),m=el.querySelector(".ibmsg"),tg=el.querySelector(".ibt"),an=el.querySelector(".iban");let stop=null;

        const g=gcd(st.nm,st.nx);if(g>1){m.innerHTML=`Balanced, but use the <b>smallest</b> whole-number ratio. Try ${st.nm/g} : ${st.nx/g}.`;return;}
        const fm=formula(st.m,st.x).text,mm=st.m,xx=st.x,ne=st.nm*cm;m.innerHTML=`Watch: ${ne} electron${ne>1?"s":""} move from ${M[mm].n.toLowerCase()} to ${N[xx].n.toLowerCase()}…`;
        if(stop)stop();stop=animate(an,mm,xx,()=>{st.made[fm]=true;m.innerHTML=`<b style="color:#2e7d4f">Bonded!</b> ${ne} electron${ne>1?"s":""} moved from ${M[mm].n.toLowerCase()} to ${N[xx].n.toLowerCase()}, and the opposite charges pulled the ions together. The compound is <b>${fm}</b>, ${name(mm,xx)}.`;if(opt.onMake)opt.onMake(fm,st.made);redraw();});}});

  /* ---- electron transfer animation ---- */
  function transfer(el,opt){opt=opt||{};const pairs=opt.pairs||[["Na","Cl"],["Mg","O"],["Mg","Cl"],["Ca","F"],["Al","O"]];const st={k:0,shown:false,seen:{}};

    const sc=el.querySelector(".trscene"),mm=el.querySelector(".trmsg");

    el.addEventListener("click",e=>{const b=e.target.closest("[data-trk]");if(b){if(st.stop)st.stop();st.k=+b.dataset.trk;st.shown=false;mm.textContent="";redraw();return;}
      if(e.target.closest("[data-trgo]")){const[m,x]=pairs[st.k],fm=formula(m,x),k=st.k;mm.textContent="Watch the electrons move…";if(st.stop)st.stop();

})();

  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  function goFS(){const el=document.documentElement,fn=el.requestFullscreen||el.webkitRequestFullscreen;if(!fn)return;try{const p=fn.call(el);if(p&&p.then)p.then(()=>{L.fsOK=true;}).catch(()=>{});else L.fsOK=true;}catch(e){}}
  function setBadge(){badge.hidden=!L.active;badge.textContent=`🔒 Lockdown on${L.count?` · left ${L.count}×`:""}`;}

      setTimeout(()=>{const i=document.getElementById("ldCode");if(i)i.focus();},50);}
    else{ov.innerHTML=`<div class="box"><h2>⚠ Stay on this page</h2><p>You ${reason}. This is recorded and shows up on your results (${L.count} time${L.count>1?"s":""} so far).</p><button type="button" id="ldBack">Go back</button></div>`;
      setTimeout(()=>{const b=document.getElementById("ldBack");if(b)b.focus();},50);}

  function violation(reason){

    else if(L.leftAt){L.away+=(Date.now()-L.leftAt)/1000;L.leftAt=null;}});
  window.addEventListener("blur",()=>{if(!L.active)return;setTimeout(()=>{if(!document.hasFocus()&&!document.hidden){L.leftAt=L.leftAt||Date.now();violation("clicked outside this page");}},150);});
  window.addEventListener("focus",()=>{if(L.leftAt&&!document.hidden){L.away+=(Date.now()-L.leftAt)/1000;L.leftAt=null;}});
  const onFS=()=>{if(!L.active)return;if(fsEl()){L.fsOK=true;}else if(L.fsOK){violation("left full screen");}};

<script>
(function(){
"use strict";
/* ===== Drag-and-drop question engine (drag, or tap a word then tap a spot) ===== */
const DND=(function(){
  const S={};let sel=null,drag=null,lastDrag=false,changeFn=null;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const plain=h=>String(h).replace(/<[^>]+>/g,"").trim();
  const zoneById=(q,id)=>q.zones.find(z=>z.id===id);
  function where(qid,ci){const P=S[qid].pl;for(const z in P)if(P[z].includes(ci))return z;return null;}
  function chip(qid,ci,mark){const s=S[qid],on=sel&&sel.qid===qid&&sel.ci===ci;
    return `<button type="button" class="dchip${on?" on":""}${mark?" "+mark:""}" data-dq="${qid}" data-ci="${ci}" aria-pressed="${on}"${s.locked?" disabled":""}>${s.q.chips[ci]}</button>`;}
  function zone(qid,z,style){const s=S[qid],items=s.pl[z.id]||[],q=s.q;let mark="";
    if(s.locked&&s.marks&&!z.multi)mark=items[0]===z.answer?" right":" wrong";
    const tgt=sel&&sel.qid===qid&&!s.locked&&(z.multi||!items.length)?" target":"";
    const inner=items.map(ci=>chip(qid,ci,s.locked&&s.marks&&z.multi?(z.answer.includes(ci)?"right":"wrong"):"")).join("")||`<span class="dph">${z.ph||"Drop here"}</span>`;
    const name=z.name||z.label||"Drop spot";
    return `<div class="dzone${z.multi?" multi":""}${items.length?" filled":""}${tgt}${mark}" data-dq="${qid}" data-dz="${z.id}"${s.locked?"":' tabindex="0" role="button"'} aria-label="${esc(plain(name))}: ${items.length?esc(items.map(ci=>plain(q.chips[ci])).join(", ")):"empty"}"${style?` style="${style}"`:""}>${inner}</div>`;}
  function inner(qid){
    const s=S[qid],q=s.q;
    const placed=new Set(Object.values(s.pl).flat());
    const bank=q.chips.map((c,ci)=>ci).filter(ci=>!placed.has(ci));
    let h=s.locked?"":`<div class="dbank" data-dq="${qid}" data-dbank="1" aria-label="Word bank">${bank.map(ci=>chip(qid,ci)).join("")||'<span class="dhint">Every card is placed. Drag one back here to remove it.</span>'}</div>`;
    if(q.figure&&q.layout!=="label")h+=`<div class="dfig2">${q.figure}</div>`;
    if(q.layout==="label")h+=`<div class="dlabel"><div class="dfig">${q.figure}</div>${q.zones.map(z=>zone(qid,z,`left:${z.x}%;top:${z.y}%;width:${z.w}%`)).join("")}</div>`;
    else if(q.layout==="rows")h+=`<div class="drows">${q.zones.map(z=>`<div class="drow"><span>${z.label}</span>${zone(qid,z)}</div>`).join("")}</div>`;
    else if(q.layout==="order")h+=`<ol class="dorder">${q.zones.map((z,k)=>`<li><span class="onum" aria-hidden="true">${k+1}</span>${zone(qid,z)}</li>`).join("")}</ol>`;
    else if(q.layout==="sort")h+=`<div class="dbins">${q.zones.map(z=>`<div class="dbin"><div class="bt">${z.label}</div>${zone(qid,{...z,multi:true})}</div>`).join("")}</div>`;
    else if(q.layout==="fill")h+=`<div class="dfill">${q.sentence.map(p=>typeof p==="string"?p:zone(qid,zoneById(q,p.z))).join("")}</div>`;
    if(!s.locked)h+=`<p class="dhow" style="font-size:14px;color:var(--muted);margin:8px 0 0">Drag a card to a spot, or tap a card and then tap the spot.</p>`;
    return h;
  }
  function refresh(qid){const el=document.getElementById("dnd-"+qid);if(el)el.innerHTML=inner(qid);}
  function focusChip(qid,ci){const b=document.querySelector(`.dchip[data-dq="${qid}"][data-ci="${ci}"]`);if(b)b.focus({preventScroll:true});}
  function place(qid,ci,zid){
    const s=S[qid],P=s.pl;for(const z in P)P[z]=P[z].filter(x=>x!==ci);
    if(zid){const z=zoneById(s.q,zid);if(!(z.multi||s.q.layout==="sort"))P[zid]=[];P[zid]=(P[zid]||[]).concat(ci);}
    sel=null;refresh(qid);if(changeFn)changeFn(qid);focusChip(qid,ci);
  }
  function mount(qid,q,pl,opts){
    opts=opts||{};q.zones.forEach(z=>{if(!pl[z.id])pl[z.id]=[];});
    S[qid]={q,pl,locked:!!opts.locked,marks:!!opts.marks};
    return `<div class="dnd" id="dnd-${qid}">${inner(qid)}</div>`;
  }
  function lock(qid,marks){if(!S[qid])return;S[qid].locked=true;S[qid].marks=!!marks;if(sel&&sel.qid===qid)sel=null;refresh(qid);}
  function complete(q,pl){if(q.layout==="sort")return Object.values(pl).flat().length===q.chips.length;return q.zones.every(z=>(pl[z.id]||[]).length>0);}
  function grade(q,pl){
    if(q.layout==="sort"){let pts=0;const lines=q.chips.map((c,ci)=>{const right=q.zones.find(z=>z.answer.includes(ci));const w=Object.keys(pl).find(z=>(pl[z]||[]).includes(ci));const ok=w===right.id;if(ok)pts++;return{label:c,ok,yours:w?zoneById(q,w).label:"not placed",right:right.label};});return{pts,max:q.chips.length,lines};}
    let pts=0;const lines=q.zones.map(z=>{const got=(pl[z.id]||[])[0];const ok=got===z.answer;if(ok)pts++;return{label:z.name||z.label,ok,yours:got===undefined?"empty":q.chips[got],right:q.chips[z.answer]};});
    return{pts,max:q.zones.length,lines};
  }
  function linesHTML(g){return `<ul>${g.lines.map(l=>`<li>${l.label}: <b class="${l.ok?"good":"wrong"}">${l.yours}</b>${l.ok?" ✓":` (correct: <b>${l.right}</b>)`}</li>`).join("")}</ul>`;}
  /* ---- events ---- */
  function clearHover(){document.querySelectorAll(".dzone.hover").forEach(e=>e.classList.remove("hover"));}
  document.addEventListener("pointerdown",e=>{lastDrag=false;const c=e.target.closest(".dchip");if(!c||c.disabled||e.button!==0)return;drag={qid:c.dataset.dq,ci:+c.dataset.ci,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId,el:c,g:null};});
  document.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;
    if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.moved=true;const g=drag.el.cloneNode(true);g.classList.remove("on");g.classList.add("dghost");document.body.appendChild(g);drag.g=g;drag.el.classList.add("lift");}
    drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px";
    const u=document.elementFromPoint(e.clientX,e.clientY),z=u&&u.closest(".dzone");clearHover();if(z&&z.dataset.dq===drag.qid)z.classList.add("hover");e.preventDefault();},{passive:false});
  function end(e,cancel){if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(!d.moved)return;lastDrag=true;d.g.remove();d.el.classList.remove("lift");clearHover();if(cancel)return;
    const u=document.elementFromPoint(e.clientX,e.clientY),z=u&&u.closest(".dzone"),b=u&&u.closest("[data-dbank]");
    if(z&&z.dataset.dq===d.qid)place(d.qid,d.ci,z.dataset.dz);else if(b&&b.dataset.dq===d.qid)place(d.qid,d.ci,null);}
  document.addEventListener("pointerup",e=>end(e,false));document.addEventListener("pointercancel",e=>end(e,true));
  document.addEventListener("click",e=>{
    const t=e.target;if(!t.closest||!t.closest(".dnd"))return;
    if(lastDrag){lastDrag=false;return;}
    const c=t.closest(".dchip");
    if(c){if(c.disabled)return;const qid=c.dataset.dq,ci=+c.dataset.ci,z=c.closest(".dzone");
      if(z&&sel&&sel.qid===qid&&sel.ci!==ci){place(qid,sel.ci,z.dataset.dz);return;}
      sel=(sel&&sel.qid===qid&&sel.ci===ci)?null:{qid,ci};refresh(qid);focusChip(qid,ci);return;}
    const z=t.closest(".dzone");if(z&&sel&&sel.qid===z.dataset.dq&&!S[z.dataset.dq].locked){place(z.dataset.dq,sel.ci,z.dataset.dz);return;}
    const b=t.closest("[data-dbank]");if(b&&sel&&sel.qid===b.dataset.dq){place(b.dataset.dq,sel.ci,null);}
  });
  document.addEventListener("keydown",e=>{
    lastDrag=false;
    const z=e.target.classList&&e.target.classList.contains("dzone")?e.target:null;
    if(z&&(e.key==="Enter"||e.key===" ")){e.preventDefault();if(sel&&sel.qid===z.dataset.dq)place(z.dataset.dq,sel.ci,z.dataset.dz);}
    if(e.key==="Escape"&&sel){const q=sel.qid;sel=null;refresh(q);}
  });
  return{mount,lock,complete,grade,linesHTML,onChange:f=>{changeFn=f;}};
})();

const T={"title": "Ionic bonding", "short": "Ionic Bonding", "phenomenon": "Sodium is a soft metal that explodes in water. Chlorine is a poisonous green gas. When they react, they make table salt, which you sprinkle on your food.", "stimulus": [{"name": "Passage", "html": "<h3>Opposites attract<\/h3>\n<p>Metals have only a few valence electrons, and nonmetals have nearly full outer shells. When a metal meets a nonmetal, the metal transfers its valence electrons to the nonmetal. The metal becomes a positive ion and the nonmetal becomes a negative ion. Both end up with full outer shells.<\/p>\n<p>Opposite charges attract. The strong attraction between positive and negative ions is called an ionic bond. The ions stack into a repeating pattern called a crystal lattice, with each ion surrounded by ions of the opposite charge.<\/p>\n<p>In every ionic compound, the total positive charge equals the total negative charge. Magnesium forms Mg²⁺, and chlorine forms Cl⁻, so it takes two chloride ions to balance one magnesium ion: MgCl₂.<\/p>\n<p>Because the bonds are so strong, ionic compounds have high melting points and form hard, brittle crystals. They conduct electricity only when melted or dissolved, when the ions are free to move."}, {"name": "Diagram", "html": "<h3>Sodium + chlorine → sodium chloride<\/h3><svg viewBox=\"0 0 560 262\" role=\"img\" aria-label=\"1 sodium atom each give 1 electron to 1 chlorine atom. They become sodium ions with a ⁺ charge and chloride ions with a ⁻ charge, forming NaCl.\"><defs><marker id=\"ibA\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#7a5ad0\"/><\/marker><\/defs><text x=\"50.0\" y=\"78.0\" font-size=\"26\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1d2b36\" font-family=\"system-ui,sans-serif\">Na<\/text><circle cx=\"50.0\" cy=\"48.0\" r=\"3.6\" fill=\"#1d2b36\"/><text x=\"100.0\" y=\"78.0\" font-size=\"22\" font-weight=\"700\" text-anchor /* Electron spots on a shell: first shell = a pair at the top. Other shells: one electron each at
   top, right, bottom, left, then the 5th to 8th pair up in that same order. */
function eSpots(n,r,first){const d=6.8/r,out=[];
  if(first){if(n===1)return[-Math.PI/2];if(n>=2)return[-Math.PI/2-d,-Math.PI/2+d];return out;}
  if(n<=8){for(let j=0;j<4;j++){const a=-Math.PI/2+j*Math.PI/2,c=(j<n?1:0)+(j<n-4?1:0);if(c===2)out.push(a-d,a+d);else if(c===1)out.push(a);}return out;}
  const slots=Math.ceil(n/2);for(let j=0;j<slots;j++){const a=-Math.PI/2+j*2*Math.PI/slots;(2*j+1<n?[a-d,a+d]:[a]).forEach(q=>out.push(q));}return out;}

const norm=s=>String(s).toLowerCase().replace(/²/g,"2").replace(/⁺/g,"+").replace(/[’‘]/g,"'").replace(/\s+/g," ").trim();
function strip(text,starter){const a=norm(text),b=norm(starter);return a.startsWith(b)?a.slice(b.length).trim():a;}
const num=v=>{const x=parseFloat(String(v).replace(/,/g,"").replace(/^\+/,"").trim());return isNaN(x)?null:x;};
function initAns(){
  state.ans=T.questions.map(q=>{
    if(q.type==="mc"||q.type==="hotspot")return null;
    if(q.type==="bohr")return q.answer.map(()=>0);
    if(q.type==="drag")return {};
    if(q.type==="ab")return {a:null,b:null};
    if(q.type==="multi")return [];
    if(q.type==="match")return q.rows.map(()=>"");
    if(q.type==="num")return q.fields.map(()=>"");
    if(q.type==="grid")return q.rows.map(()=>q.cols.map(()=>""));
    if(q.type==="cer"){const o={};PARTS.forEach(p=>o[p.key]=q[p.key].starter);return o;}
  });
}
function answered(i){
  const q=T.questions[i],a=state.ans[i];
  if(q.type==="mc"||q.type==="hotspot")return a!==null;
  if(q.type==="bohr")return a.some(x=>x>0);
  if(q.type==="drag")return DND.complete(q,a);
  if(q.type==="ab")return a.a!==null&&a.b!==null;
  if(q.type==="multi")return a.length===q.pick;
  if(q.type==="match"||q.type==="num")return a.every(x=>String(x).trim());
  if(q.type==="grid")return a.every(r=>r.every(x=>String(x).trim()));
  if(q.type==="cer")return PARTS.every(p=>strip(a[p.key],q[p.key].starter).length>=3);
}

function start(){
  const f={first:$("#first"),last:$("#last"),sid:$("#sid"),sid2:$("#sid2"),period:$("#period"),teacher:$("#teacher")};
  Object.values(f).forEach(el=>el.classList.remove("error"));
  const v=k=>f[k].value.trim();
  let msg="";
  for(const k of ["first","last","sid","sid2","period","teacher"]){if(!v(k)){f[k].classList.add("error");msg=msg||"Fill in every box before you start.";}}
  const sid=v("sid").replace(/\s+/g,""),sid2=v("sid2").replace(/\s+/g,"");
  if(!msg&&!/^\d+$/.test(sid)){f.sid.classList.add("error");msg="Use only numbers in your student ID. No letters, dashes, or other symbols.";}
  if(!msg&&sid.length>15){f.sid.classList.add("error");msg="That student ID is too long. Check your ID number.";}
  if(!msg&&sid!==sid2){f.sid2.classList.add("error");msg="The two student ID boxes don't match. Check your ID number.";}
  if(msg){$("#signerr").textContent=msg;const bad=document.querySelector(".fields .error");if(bad)bad.focus();return;}
  state.stu={first:v("first"),last:v("last"),id:sid,period:v("period"),teacher:v("teacher")};
  $("#whoami").textContent=`${state.stu.first} ${state.stu.last}, Period ${state.stu.period}`;
  $("#signin").hidden=true;$("#test").hidden=false;
  if(window.LOCKDOWN)LOCKDOWN.start();
  go(0);
}

$("#signform").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();start();}});

/* ---------- questions ---------- */
function qHTML(i){
  const q=T.questions[i],a=state.ans[i];
  const uses=q.uses&&q.uses.length?`<div class="uses">${q.uses.map(u=>`<button type="button" data-use="${u}">Use the ${u} tab</button>`).join("")}</div>`:"";
  const hint=q.hint?`<p class="hint">${q.hint}</p>`:"";
  let body="";
  if(q.type==="mc") body=`<fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">${esc(plain(q.prompt))}</legend><div class="opts">${q.options.map((o,j)=>`<label class="opt"><input type="radio" name="mc${i}" data-mc="${i}" value="${j}"${a===j?" checked":""}><span>${o}</span></label>`).join("")}</div></fieldset>`;
  if(q.type==="multi") body=`<fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">${esc(plain(q.prompt))}</legend><div class="opts">${q.options.map((o,j)=>`<label class="opt"><input type="checkbox" data-multi="${i}" value="${j}"${a.includes(j)?" checked":""}><span>${o}</span></label>`).join("")}</div></fieldset><p class="err" id="mmsg${i}" role="alert"></p>`;
  if(q.type==="match") body=`<div class="rows">${q.rows.map((r,k)=>`<div class="row"><span id="m${i}_${k}">${r.label}</span><select class="pick${a[k]?" has":""}" data-match="${i}" data-r="${k}" aria-labelledby="m${i}_${k}"><option value="">Choose</option>${q.choices.map(c=>`<option${a[k]===c?" selected":""}>${esc(c)}</option>`).join("")}</select></div>`).join("")}</div>`;
  if(q.type==="num") body=`<div class="nums">${q.fields.map((f,k)=>`<label>${f.label}<span class="unitwrap"><input class="n" type="text" inputmode="decimal" data-num="${i}" data-f="${k}" value="${esc(a[k])}">${f.unit||""}</span></label>`).join("")}</div>`;
  if(q.type==="grid") body=`<div style="overflow-x:auto"><table class="grid"><thead><tr><th>Atom</th>${q.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${q.rows.map((r,k)=>`<tr><td>${r.label}</td>${q.cols.map((c,m)=>`<td><input class="n" type="text" inputmode="numeric" aria-label="${esc(plain(r.label))} ${c}" data-grid="${i}" data-r="${k}" data-c="${m}" value="${esc(a[k][m])}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if(q.type==="hotspot"){
    const cells={};T.ptable.forEach(c=>cells[c[1]+"_"+c[2]]=c[0]);
    const stair=T.staircase||{left:[],bottom:[]};
    let g=`<div></div>`;for(let c=1;c<=18;c++)g+=`<div class="gh">${c}</div>`;
    for(let p=1;p<=T.periods;p++){g+=`<div class="ph">${p}</div>`;for(let c=1;c<=18;c++){const s=cells[p+"_"+c];
      if(!s){g+=`<div></div>`;continue;}
      const sel=a&&(q.mode==="group"?a.group===c:a.sym===s);
      const cls=(stair.left.includes(s)?" sl":"")+(stair.bottom.includes(s)?" sb":"");
      g+=`<button type="button" class="cell${sel?" sel":""}${cls}" data-hs="${i}" data-sym="${s}" data-group="${c}" aria-pressed="${!!(a&&a.sym===s)}" aria-label="${s}, group ${c}, period ${p}">${s}</button>`;}}
    body=`<div class="pt" role="group" aria-label="Clickable periodic table">${g}</div><p class="ptkey">${q.mode==="group"?"Click any element in a group to select the whole group.":"Click one element."} The bold line is the staircase.${a?` <b>Selected: ${q.mode==="group"?`group ${a.group}`:a.sym}</b>`:""}</p>`;
  }
  if(q.type==="drag")body=DND.mount(i,q,a,{});
  if(q.type==="ab")body=["a","b"].map(p=>`<fieldset style="border:0;padding:0;margin:0 0 14px"><legend style="font-weight:400;margin-bottom:8px">${q[p].q}</legend><div class="opts">${q[p].o.map((o,j)=>`<label class="opt"><input type="radio" name="ab${i}${p}" data-abp="${i}:${p}" value="${j}"${a[p]===j?" checked":""}><span>${o}</span></label>`).join("")}</div></fieldset>`).join("");
  if(q.type==="bohr"){
    const R=[34,52,70,88].slice(0,a.length),C=100;
    let g=R.map(r=>`<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="#9fb4b0" stroke-width="2"/>`).join("");
    a.forEach((n,k)=>{const r=R[k];eSpots(n,r,k===0).forEach(q=>{g+=`<circle cx="${(C+r*Math.cos(q)).toFixed(1)}" cy="${(C+r*Math.sin(q)).toFixed(1)}" r="5.5" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/>`;});});
    g+=`<circle cx="${C}" cy="${C}" r="22" fill="#fbe3df" stroke="#b8403a" stroke-width="2"/><text x="${C}" y="${C-2}" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b36">${q.nucleus[0]}</text><text x="${C}" y="${C+12}" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b36">${q.nucleus[1]}</text>`;
    const total=a.reduce((x,y)=>x+y,0);
    body=`<div class="bohr"><svg viewBox="0 0 200 200" role="img" aria-label="Your Bohr model: ${a.map((n,k)=>`shell ${k+1} has ${n}`).join(", ")}">${g}</svg>
     <div class="shells">${a.map((n,k)=>`<div class="shellrow"><span class="nm">Shell ${k+1}</span><button type="button" data-bohr="${i}" data-k="${k}" data-d="-1" aria-label="Remove an electron from shell ${k+1}"${n<=0?" disabled":""}>−</button><output aria-live="polite">${n}</output><button type="button" data-bohr="${i}" data-k="${k}" data-d="1" aria-label="Add an electron to shell ${k+1}"${n>=q.maxPer?" disabled":""}>+</button></div>`).join("")}
     <span class="bohrtotal">Total electrons: <b>${total}</b></span></div></div>`;
  }
  if(q.type==="cer") body=`<p class="hint">Finish each sentence starter. Use evidence from the stimulus and your unit vocabulary.</p><div class="cer">${PARTS.map(p=>`<div class="cer-part"><label for="cer${i}${p.key}"><span class="tag">${p.name}</span><span class="guide">${p.guide}</span></label><textarea id="cer${i}${p.key}" data-cer="${i}" data-part="${p.key}">${esc(a[p.key])}</textarea></div>`).join("")}</div>`;
  const fl=state.flags.has(i);
  return `<div class="qmeta"><span>Question ${i+1} of ${N}${q.type==="cer"?" (written response)":""}</span><button type="button" class="flag" data-flag="${i}" aria-pressed="${fl}">${fl?"⚑ Flagged":"⚐ Flag for review"}</button></div>
   <p class="prompt" id="qprompt">${q.prompt}</p>${uses}${hint}${body}
   <div class="qnav"><button type="button" class="btn secondary" data-go="${i-1}"${i===0?" disabled":""}>Back</button><button type="button" class="btn" data-go="${i+1}">${i===N-1?"Review answers":"Next"}</button></div>`;
}
function reviewHTML(){
  const items=T.questions.map((q,i)=>{
    const st=answered(i)?`<span class="st ok">Answered</span>`:`<span class="st no">Not answered</span>`;
    const fl=state.flags.has(i)?` <span class="st fl">⚑ Flagged</span>`:"";
    return `<li><span><button type="button" class="linkbtn" data-go="${i}">Question ${i+1}</button> ${esc(plain(q.prompt)).slice(0,70)}${plain(q.prompt).length>70?"…":""}</span><span>${st}${fl}</span></li>`;
  }).join("");
  const left=T.questions.filter((q,i)=>!answered(i)).length;
  return `<h2 style="font-size:24px">Review your answers</h2><p class="hint" style="margin:6px 0 0">${left?`${left} question${left>1?"s are":" is"} not finished.`:"Every question has an answer."} Click a question to go back to it.</p>
   <ul class="review-list">${items}</ul>
   <div class="qnav"><button type="button" class="btn secondary" data-go="${N-1}">Back</button><button type="button" class="btn" id="submit">Turn in exit ticket</button></div>
   <div id="confirmbox" class="confirmbox" hidden></div>`;
}
function renderNav(){
  $("#navq").innerHTML=T.questions.map((q,i)=>`<button type="button" data-go="${i}" class="${answered(i)?"done ":""}${state.cur===i?"cur ":""}${state.flags.has(i)?"flagged":""}" aria-label="Question ${i+1}${answered(i)?", answered":""}${state.flags.has(i)?", flagged":""}"${state.cur===i?' aria-current="step"':""}>${i+1}</button>`).join("")+
    `<button type="button" data-go="${N}" class="${state.cur===N?"cur":""}"${state.cur===N?' aria-current="step"':""}>Review</button>`;
}
function go(i){
  if(i<0||i>N)return;
  state.cur=i;
  if(i<N){const q=T.questions[i];if(q.uses&&q.uses.length)showTab(q.uses[0]);else renderStim();$("#qpane").innerHTML=qHTML(i);}
  else{renderStim();$("#qpane").innerHTML=reviewHTML();}
  renderNav();
  const h=$("#qpane .prompt, #qpane h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}
  if(window.innerWidth<900)$("#qpane").scrollIntoView({block:"start"});
}

window.addEventListener("beforeunload",e=>{if(state.stu&&!state.done){e.preventDefault();e.returnValue="";}});

/* ---------- grading ---------- */
function scorePart(text,spec){
  const body=strip(text,spec.starter);
  return spec.keys.map(k=>({label:k.label,hit:body.length>0&&k.any.some(r=>new RegExp(r,"i").test(body))&&!(k.none||[]).some(r=>new RegExp(r,"i").test(body))}));
}
function grade(q,a){
  if(q.type==="mc"){const ok=a===q.answer;return{pts:ok?1:0,max:1,html:`<div>Your answer: <b class="${ok?"good":"wrong"}">${a===null?"No answer":q.options[a]}</b></div>${ok?"":`<div>Correct answer: <b>${q.options[q.answer]}</b></div>`}`};}
  if(q.type==="hotspot"){
    const ok=a!==null&&(q.mode==="group"?a.group===q.answer:q.answer.includes(a.sym));
    const yours=a===null?"No answer":q.mode==="group"?`Group ${a.group}`:a.sym;
    const right=q.mode==="group"?`Group ${q.answer}`:`any of ${q.answer.join(", ")}`;
    return{pts:ok?1:0,max:1,html:`<div>Your answer: <b class="${ok?"good":"wrong"}">${yours}</b></div>${ok?"":`<div>Correct answer: <b>${right}</b></div>`}`};
  }
  if(q.type==="ab"){const oa=a.a===q.a.ans,ob=a.b===q.b.ans;const ln=(P,v,ok)=>`<li>${P.q}<br>Your answer: <b class="${ok?"good":"wrong"}">${v===null?"No answer":P.o[v]}</b>${ok?" ✓":`<br>Correct answer: <b>${P.o[P.ans]}</b>`}</li>`;
    return{pts:(oa?1:0)+(ob?1:0),max:2,html:`<ul>${ln(q.a,a.a,oa)}${ln(q.b,a.b,ob)}</ul>`};}
  if(q.type==="drag"){const g=DND.grade(q,a);return{pts:g.pts,max:g.max,html:DND.linesHTML(g)};}
  if(q.type==="bohr"){
    const tot=a.reduce((x,y)=>x+y,0),need=q.answer.reduce((x,y)=>x+y,0);
    const t1=tot===need,t2=a.every((n,k)=>n===q.answer[k]);
    const show=arr=>arr.slice(0,Math.max(1,arr.reduce((m,n,k)=>n?k+1:m,0))).join(", ");
    return{pts:(t1?1:0)+(t2?1:0),max:2,html:`<ul><li>Total electrons: <b class="${t1?"good":"wrong"}">${tot}</b>${t1?" ✓":` (correct: <b>${need}</b>)`}</li><li>Electrons in each shell: <b class="${t2?"good":"wrong"}">${tot?show(a):"No answer"}</b>${t2?" ✓":` (correct: <b>${show(q.answer)}</b>)`}</li></ul>`};
  }
  if(q.type==="multi"){const hits=a.filter(j=>q.answer.includes(j)).length;return{pts:hits,max:q.answer.length,html:`<div>Your choices: <b>${a.length?a.map(j=>`<span class="${q.answer.includes(j)?"good":"wrong"}">${q.options[j]}</span>`).join("; "):"No answer"}</b></div>${hits===q.answer.length?"":`<div>Correct choices: <b>${q.answer.map(j=>q.options[j]).join("; ")}</b></div>`}`};}
  if(q.type==="match"){let p=0;const li=q.rows.map((r,k)=>{const ok=a[k]===r.answer;if(ok)p++;return `<li>${r.label}: <b class="${ok?"good":"wrong"}">${a[k]?esc(a[k]):"No answer"}</b>${ok?" ✓":` (correct: <b>${esc(r.answer)}</b>)`}</li>`;}).join("");return{pts:p,max:q.rows.length,html:`<ul>${li}</ul>`};}
  if(q.type==="num"){let p=0;const li=q.fields.map((f,k)=>{const v=num(a[k]);const ok=v!==null&&Math.abs(v-f.answer)<=(f.tol||0)+1e-9;if(ok)p++;return `<li>${f.label}: <b class="${ok?"good":"wrong"}">${a[k]?esc(a[k]):"No answer"}</b>${ok?" ✓":` (correct: <b>${f.answer}${f.unit?" "+f.unit:""}</b>)`}</li>`;}).join("");return{pts:p,max:q.fields.length,html:`<ul>${li}</ul>`};}
  if(q.type==="grid"){let p=0;const li=q.rows.map((r,k)=>{const ok=r.answers.every((ans,m)=>num(a[k][m])===ans);if(ok)p++;return `<li>${r.label} (${q.cols.join(", ").toLowerCase()}): <b class="${ok?"good":"wrong"}">${a[k].map(x=>x||"?").join(", ")}</b>${ok?" ✓":` (correct: <b>${r.answers.join(", ")}</b>)`}</li>`;}).join("");return{pts:p,max:q.rows.length,html:`<ul>${li}</ul>`};}
  if(q.type==="cer"){
    let p=0,m=0;
    const html=PARTS.map(pt=>{
      const r=scorePart(a[pt.key],q[pt.key]);const hp=r.filter(x=>x.hit).length;p+=hp;m+=r.length;
      const body=strip(a[pt.key],q[pt.key].starter);
      return `<div class="cer-res"><h4><span>${pt.name}</span><span class="pts">${hp} / ${r.length}</span></h4><div class="student">${body.length?esc(a[pt.key].trim()):"<i>No answer</i>"}</div><div class="vocab">${r.map(x=>`<span class="${x.hit?"hit":"miss"}">${x.hit?"✓":"✗"} ${esc(x.label)}</span>`).join("")}</div></div>`;
    }).join("");
    return{pts:p,max:m,html:html+`<div class="explain"><b>A strong answer:</b><ul>${PARTS.map(pt=>`<li><b>${pt.name}:</b> ${esc(q[pt.key].sample)}</li>`).join("")}</ul><span class="hint" style="display:block;margin:6px 0 0">Scored by key vocabulary. Your teacher will read your answer and may adjust this score.</span></div>`,cer:true};
  }
}

/* ---------- submit, export, send ---------- */
let RESULT=null;
function askSubmit(){
  const left=T.questions.filter((q,i)=>!answered(i)).length;
  const box=$("#confirmbox");
  box.innerHTML=`<p><b>${left?`${left} question${left>1?"s are":" is"} not finished.`:"Ready to turn it in?"}</b> Once you turn in your exit ticket, you can't change your answers.</p>
   <div class="btn-row"><button type="button" class="btn" id="confirmsubmit">Yes, turn it in</button><button type="button" class="btn secondary" id="cancelsubmit">Keep working</button></div>`;
  box.hidden=false;$("#confirmsubmit").focus();
}
function submit(){
  let pts=0,max=0;const items=[];
  const blocks=T.questions.map((q,i)=>{
    const g=grade(q,state.ans[i]);pts+=g.pts;max+=g.max;items.push(g.pts);
    const cls=g.pts===g.max?"ok":g.pts===0?"bad":"part";
    return `<div class="res ${cls}"><h3><span>${i+1}.</span><span>${q.prompt}</span><span class="pts">${g.pts} / ${g.max}</span></h3>${g.html}${g.cer?"":`<p class="explain">${q.explain}</p>`}</div>`;
  });
  if(window.LOCKDOWN)LOCKDOWN.stop();
  const LD=window.LOCKDOWN&&LOCKDOWN.enabled?LOCKDOWN.summary():null;
  const now=new Date();
  const pct=max?Math.round(pts/max*1000)/10:0;
  const s=state.stu;
  const header=["Student ID","# Correct","Last Name","First Name","Period","Teacher","Points Possible","Percent","Exit Ticket","Submitted"].concat(T.questions.map((q,i)=>`Q${i+1}${q.type==="cer"?" CER":""}`)).concat(LD?["Times Left Page","Seconds Away"]:[]);
  const row=[s.id,pts,s.last,s.first,s.period,s.teacher,max,pct,T.title,now.toLocaleString()].concat(items).concat(LD?[LD.count,LD.away]:[]);
  const tab=`${T.short}${CFG.TEACHERS.length>1?" "+s.teacher.split(/\s+/).pop():""} P${s.period}`;
  RESULT={header,row,tab};
  state.done=true;
  $("#results").innerHTML=`<div class="panel">
   <h2 style="font-size:26px">${esc(T.title)}: your results</h2>
   <div class="res-top"><div class="score">${pts}<small> / ${max}</small></div>
    <div class="res-meta"><div><b>${esc(s.first)} ${esc(s.last)}</b>, ID ${esc(s.id)}</div><div>Period ${esc(s.period)}, ${esc(s.teacher)}</div><div>${now.toLocaleString()}</div>${LD?`<div>Left the exit ticket: <b>${LD.count}</b> time${LD.count===1?"":"s"}${LD.count?` (${LD.away} seconds away)`:""}</div>`:""}</div></div>
   <div id="sendbox" class="sendbox wait no-print">Sending your score to your teacher…</div>
   <div class="btn-row no-print"><button type="button" class="btn" id="print">Print results</button><button type="button" class="btn secondary" id="dlcsv">Download my results (CSV)</button></div>
   ${blocks.join("")}</div>`;
  $("#test").hidden=true;$("#results").hidden=false;window.scrollTo({top:0});
  send();
}
function send(){
  const box=$("#sendbox");
  if(!CFG.SHEET_URL){box.className="sendbox bad no-print";box.innerHTML=`This exit ticket isn't connected to your teacher's gradebook yet. Click <b>Download my results (CSV)</b> and turn in the file the way your teacher asks.`;return;}
  box.className="sendbox wait no-print";box.textContent="Sending your score to your teacher…";
  fetch(CFG.SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(RESULT)})
   .then(()=>{box.className="sendbox ok no-print";box.textContent="✓ Your score was sent to your teacher.";})
   .catch(()=>{box.className="sendbox bad no-print";box.innerHTML=`Your score didn't send. Check your internet connection, then <button type="button" class="linkbtn" id="resend">try again</button>. If it still won't send, download your results instead.`;});
}
function csvCell(v){v=String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}
function downloadCSV(){
  const csv=[RESULT.header,RESULT.row].map(r=>r.map(csvCell).join(",")).join("\r\n");
  const b=new Blob([csv],{type:"text/csv"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=`${T.short.replace(/\s+/g,"-")}_${state.stu.last}_${state.stu.first}_${state.stu.id}.csv`.replace(/[^\w.-]/g,"");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
}

DND.onChange(()=>renderNav());
buildSignin();initAns();
})();
</script>
